<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>Waldwacht – Fort Tycoon</title><style>html,body{margin:0;overflow:hidden;background:#8cc49a;font-family:system-ui;color:white;touch-action:none}#hud{position:absolute;top:env(safe-area-inset-top);left:10px;right:10px;display:flex;gap:7px;flex-wrap:wrap;pointer-events:none}.pill{background:#172c25d9;border-radius:18px;padding:8px 12px;font-weight:750;font-size:13px}#msg{position:absolute;top:92px;left:10px;right:10px;text-align:center;text-shadow:0 2px 5px #111;font-weight:700;pointer-events:none}#shop{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));right:10px;display:flex;flex-direction:column;gap:7px}button{border:0;border-radius:15px;background:#fff2ce;color:#3e3324;padding:11px;font-size:13px;font-weight:800;box-shadow:0 3px 0 #b99c66}button:disabled{opacity:.5}#stick{position:absolute;bottom:calc(45px + env(safe-area-inset-bottom));left:24px;width:112px;height:112px;border:3px solid #ffffff70;border-radius:100%;background:#ffffff2a;touch-action:none}#knob{position:absolute;left:36px;top:36px;width:40px;height:40px;border-radius:50%;background:#fff9;box-shadow:0 2px 8px #3336}#hint{position:absolute;bottom:calc(5px + env(safe-area-inset-bottom));left:15px;font-size:11px;text-shadow:0 1px 4px #111}</style></head><body><div id="hud"><div class="pill" id="money">💰 0</div><div class="pill" id="wood">🪵 0</div><div class="pill" id="meat">🥩 0</div><div class="pill" id="hp">❤️ 100</div></div><div id="msg">Mit dem Kreis bewegen. An Bäume und Bären heranlaufen!</div><div id="stick"><div id="knob"></div></div><div id="shop"><button id="helper">🪓 Helfer · 20</button><button id="archer">🏹 Bogenschütze · 100</button><button id="machine">🚜 Holzmaschine · 80</button><button id="belt">⚙️ Förderband · 160</button></div><div id="hint">Im Fort werden Vorräte automatisch verkauft</div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9acfc6);scene.fog=new THREE.Fog(0x9acfc6,30,85);const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,130);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xfff6db,0x55765b,2.2));const sun=new THREE.DirectionalLight(0xffe6a7,2.4);sun.position.set(-10,22,12);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.83});const green=mat(0x6ab66d),woodMat=mat(0x916139),leaf=mat(0x267f43),bearMat=mat(0x79503a),skin=mat(0xf5c99b),blue=mat(0x376d9c),gold=mat(0xf8cb45),red=mat(0xb94a42),stone=mat(0xb0aa94);function mesh(g,m,x,y,z,p=scene){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;p.add(o);return o}function box(w,h,d,m,x,y,z,p){return mesh(new THREE.BoxGeometry(w,h,d),m,x,y,z,p)}function ball(r,m,x,y,z,p){return mesh(new THREE.SphereGeometry(r,10,8),m,x,y,z,p)}const ground=box(90,.2,90,green,0,-.15,0);const fort=box(12,.12,12,mat(0xb8a276),0,.01,0);for(let i=-6;i<=6;i+=1.3){for(let s of [-1,1]){if(Math.abs(i)>1.5)box(.8,2,.8,woodMat,i,1,s*6);box(.8,2,.8,woodMat,s*6,1,i)}}box(3,.25,.6,stone,0,.1,5.8);const storage=box(2,.5,2,woodMat,-3,.35,0);const stall=box(2,.7,2,mat(0x8d4f40),3,.4,0);box(2.7,.15,2.5,red,3,1.65,0);
function human(x,z,color=blue){const g=new THREE.Group();scene.add(g);g.position.set(x,0,z);box(.7,1,.48,color,0,1.1,0,g);ball(.38,skin,0,1.85,0,g);box(.23,.7,.25,woodMat,-.23,.35,0,g);box(.23,.7,.25,woodMat,.23,.35,0,g);return g}const player=human(0,0);const trees=[];function tree(x,z){const g=new THREE.Group();scene.add(g);g.position.set(x,0,z);mesh(new THREE.CylinderGeometry(.26,.38,2,7),woodMat,0,1,0,g);mesh(new THREE.ConeGeometry(1.25,2.8,8),leaf,0,3,0,g);trees.push({g,x,z,hp:3,respawn:0})}for(let i=0;i<26;i++){const a=i*2.399, r=10+(i%5)*3.7;tree(Math.sin(a)*r,Math.cos(a)*r)}const bears=[];function spawnBear(){if(bears.length>=6)return;let a=Math.random()*Math.PI*2,r=17+Math.random()*10;const g=new THREE.Group();scene.add(g);g.position.set(Math.cos(a)*r,0,Math.sin(a)*r);box(1.2,.8,1.6,bearMat,0,.75,0,g);ball(.56,bearMat,0,1.1,-.85,g);ball(.2,bearMat,-.38,1.55,-.9,g);ball(.2,bearMat,.38,1.55,-.9,g);bears.push({g,hp:4,hit:0})}for(let i=0;i<3;i++)spawnBear();const drops=[];function drop(x,z,type){let m=type==='wood'?woodMat:red;let g=box(.45,.4,.45,m,x,.25,z);drops.push({g,type})}let money=0,wood=0,meat=0,hp=100,helpers=0,archers=0,machines=0,belts=0,attack=0,sell=0,spawn=0,auto=0;const agents=[];function helperAgent(){let g=human(-2+helpers,2,mat(0xe8b95a));agents.push(g)}function dist(a,b){return Math.hypot(a.x-b.x,a.z-b.z)}let move={x:0,z:0};const stick=document.getElementById('stick'),knob=document.getElementById('knob');function joystick(e){const b=stick.getBoundingClientRect(),x=e.clientX-(b.left+b.width/2),y=e.clientY-(b.top+b.height/2),l=Math.max(1,Math.hypot(x,y)),f=Math.min(1,50/l);move.x=x*f/50;move.z=y*f/50;knob.style.transform=`translate(${move.x*34}px,${move.z*34}px)`}stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);joystick(e)});stick.addEventListener('pointermove',e=>{if(stick.hasPointerCapture(e.pointerId))joystick(e)});function stop(){move.x=move.z=0;knob.style.transform=''}stick.addEventListener('pointerup',stop);stick.addEventListener('pointercancel',stop);const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const costs={helper:20,archer:100,machine:80,belt:160};function buy(k){if(money<costs[k])return;money-=costs[k];if(k==='helper'){helpers++;helperAgent()}if(k==='archer'){archers++;let g=human(-4+archers*1.4,-5,mat(0x547848));g.position.y=1.5}if(k==='machine'){machines++;box(1.6,.8,2,mat(0xe3b83b),-4+machines*1.5,0.5,-2)}if(k==='belt'){belts++;box(1.1,.3,4,mat(0x4a5358),1+belts,0.3,1)}costs[k]=Math.ceil(costs[k]*1.7);update()}for(const k in costs)document.getElementById(k).onclick=()=>buy(k);function update(){document.getElementById('money').textContent='💰 '+money;document.getElementById('wood').textContent='🪵 '+wood;document.getElementById('meat').textContent='🥩 '+meat;document.getElementById('hp').textContent='❤️ '+Math.ceil(hp);for(const k in costs){const b=document.getElementById(k);b.disabled=money<costs[k];b.textContent={helper:'🪓 Helfer',archer:'🏹 Bogenschütze',machine:'🚜 Holzmaschine',belt:'⚙️ Förderband'}[k]+' · '+costs[k]}}update();let prev=performance.now();function loop(now){requestAnimationFrame(loop);let dt=Math.min(.05,(now-prev)/1000);prev=now;let mx=move.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),mz=move.z+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);let len=Math.hypot(mx,mz);if(len>.01){player.position.x+=mx/len*5*dt;player.position.z+=mz/len*5*dt;player.rotation.y=Math.atan2(-mx,-mz)}player.position.x=THREE.MathUtils.clamp(player.position.x,-40,40);player.position.z=THREE.MathUtils.clamp(player.position.z,-40,40);attack-=dt;for(const t of trees){if(t.respawn>0){t.respawn-=dt;if(t.respawn<=0){t.g.visible=true;t.hp=3}continue}if(dist(player.position,t.g.position)<2.1&&attack<=0){t.hp--;attack=.45;t.g.scale.setScalar(.93);setTimeout(()=>t.g.scale.setScalar(1),130);if(t.hp<=0){t.g.visible=false;t.respawn=16;for(let i=0;i<3;i++)drop(t.x+(Math.random()-.5),t.z+(Math.random()-.5),'wood')}}}for(let i=bears.length-1;i>=0;i--){const b=bears[i],d=dist(player.position,b.g.position);if(d<13){const dx=player.position.x-b.g.position.x,dz=player.position.z-b.g.position.z;if(d>1.2){b.g.position.x+=dx/d*dt*1.1;b.g.position.z+=dz/d*dt*1.1}b.g.rotation.y=Math.atan2(-dx,-dz)}b.hit-=dt;if(d<1.8&&b.hit<=0){hp-=9;b.hit=1.3}if(d<2.5&&attack<=0){b.hp-=1+Math.floor(archers/2);attack=.5}if(archers>0&&dist(b.g.position,{x:0,z:0})<10)b.hp-=dt*archers*.7;if(b.hp<=0){for(let j=0;j<3;j++)drop(b.g.position.x+(Math.random()-.5),b.g.position.z+(Math.random()-.5),'meat');scene.remove(b.g);bears.splice(i,1)}}for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.g.rotation.y+=dt*2;if(dist(player.position,d.g.position)<1.6){if(d.type==='wood')wood++;else meat++;scene.remove(d.g);drops.splice(i,1)}}if(Math.abs(player.position.x)<5.6&&Math.abs(player.position.z)<5.6){sell+=dt;if(sell>.7){sell=0;if(wood>0){wood--;money+=3+belts}if(meat>0){meat--;money+=5+belts}}hp=Math.min(100,hp+dt*5)}if(hp<=0){hp=100;player.position.set(0,0,0);document.getElementById('msg').textContent='Du wurdest gerettet und bist zurück im Fort!'}auto+=dt;if(auto>2.5){auto=0;wood+=helpers+machines*2}spawn+=dt;if(spawn>9){spawn=0;spawnBear()}for(let i=0;i<agents.length;i++){let a=now/1200+i*2*Math.PI/Math.max(1,agents.length);agents[i].position.set(Math.cos(a)*3,0,Math.sin(a)*3)}camera.position.lerp(new THREE.Vector3(player.position.x+13,19,player.position.z+20),.055);camera.lookAt(player.position.x,0,player.position.z);renderer.render(scene,camera);update()}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>
